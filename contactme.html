<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rafael Vicuna - Contact Me</title>
    <link rel="stylesheet" href="style.css"> <!-- FOR HANDS-ON 2 -->
</head>

<body>

    <header>
        <h1>Contact Me</h1>

        <nav>
            <a href="index.html">Home</a> |
            <a href="aboutme.html">About Me</a> |
            <a href="contactme.html">Contact Me</a>
        </nav>
    </header>

    <main>

        <section>
            <h2>You can reach out to me through the following!</h2>

            <ul>
                <li>
                    <a href="https://www.facebook.com/vicunarafael486" target="_blank">
                        Facebook
                    </a>
                </li>

                <li>
                    <a href="https://www.instagram.com/vicunarafael86" target="_blank">
                        Instagram
                    </a>
                </li>

                <li>
                    <a href="https://www.youtube.com/c/xxrafaelproductions" target="_blank">
                        YouTube
                    </a>
                </li>
            </ul>
        </section>


        <section>
            <h2>Contact Form</h2>

            <form>

                <fieldset>

                    <legend>Send Me a Message</legend>

                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name">
                    <br><br>

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email">
                    <br><br>

                    <label for="age">Age:</label>
                    <input type="number" id="age" name="age">
                    <br><br>

                    <p>Preferred contact method:</p>

                    <input type="radio" id="email-contact" name="contact-method" value="email">
                    <label for="email-contact">Email</label>

                    <input type="radio" id="social-contact" name="contact-method" value="social-media">
                    <label for="social-contact">Social Media</label>

                    <br><br>

                    <p>What are you interested in?</p>

                    <input type="checkbox" id="programming" name="interest" value="programming">
                    <label for="programming">Programming</label>

                    <input type="checkbox" id="cybersecurity" name="interest" value="cybersecurity">
                    <label for="cybersecurity">Cybersecurity</label>

                    <input type="checkbox" id="music" name="interest" value="music">
                    <label for="music">Music</label>

                    <br><br>

                    <label for="date">Preferred Date:</label>
                    <input type="date" id="date" name="date">
                    <br><br>

                    <label for="message">Message:</label>
                    <br>
                    <textarea id="message" name="message" rows="5" cols="40"></textarea>

                    <br><br>

                    <input type="submit" value="Send Message">
                    <input type="reset" value="Reset">

                </fieldset>

            </form>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Rafael Vicuna - CCAPDEV</p>
    </footer>

</body>

</html>
